# -- prefix -------------------------------------------------------------------
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# -- windows / panes ----------------------------------------------------------
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# -- general ------------------------------------------------------------------
set -g mouse on
set -g history-limit 50000
set -sg escape-time 10
set -g focus-events on

# -- true color ---------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# -- reload config ------------------------------------------------------------
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# -- plugins (tpm) ------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'

# -- gruvbox dark theme ------------------------------------------------------
# Palette:
#   bg0=#282828 bg1=#3c3836 bg2=#504945 bg3=#665c54 bg4=#7c6f64
#   fg=#ebdbb2 gray=#928374
#   red=#fb4934 green=#b8bb26 yellow=#fabd2f blue=#83a598
#   purple=#d3869b aqua=#8ec07c orange=#fe8019

set -g status-position top
set -g status-style 'bg=#282828 fg=#ebdbb2'

set -g status-left-length 40
set -g status-left '#[fg=#282828,bg=#fabd2f,bold] #S #[fg=#fabd2f,bg=#282828,nobold] '

set -g status-right-length 150
set -g status-right '#[fg=#3c3836,bg=#282828]#[fg=#ebdbb2,bg=#3c3836] CPU:#{cpu_percentage} #[fg=#504945,bg=#3c3836]#[fg=#ebdbb2,bg=#504945] #{battery_icon}#{battery_percentage} #[fg=#83a598,bg=#504945]#[fg=#282828,bg=#83a598,bold] %Y-%m-%d %H:%M '

# window status
setw -g window-status-separator ''
setw -g window-status-style 'fg=#a89984 bg=#282828'
setw -g window-status-format ' #I:#W '
setw -g window-status-current-style 'fg=#282828 bg=#83a598 bold'
setw -g window-status-current-format ' #I:#W#{?window_zoomed_flag, 󰊓,} '
setw -g window-status-activity-style 'fg=#fe8019 bg=#282828 bold'

# panes
set -g pane-border-style 'fg=#3c3836'
set -g pane-active-border-style 'fg=#fabd2f'

# messages
set -g message-style 'fg=#282828 bg=#fabd2f bold'
set -g message-command-style 'fg=#282828 bg=#fabd2f bold'

# copy mode
setw -g mode-style 'fg=#282828 bg=#fabd2f bold'

# Keep this line at the very bottom of tmux.conf.
run '~/.tmux/plugins/tpm/tpm'
